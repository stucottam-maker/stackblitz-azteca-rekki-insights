<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#214f3d" />
    <title>Kitchen Insights</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f3ef; color: #1f211d; }
      main { width: min(420px, 100%); padding: 24px; border: 1px solid #e6e3dc; border-radius: 18px; background: #fff; box-shadow: 0 12px 36px rgba(26,31,27,.08); }
      .mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 15px; background: #bd5f31; color: #fff; font-weight: 800; }
      h1 { margin: 18px 0 8px; font-size: 28px; }
      p { margin: 0; line-height: 1.5; color: #6f716a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">KI</div>
      <h1>Kitchen Insights</h1>
      <p>The Android app could not reach the live Kitchen Insights service. Check your internet connection and reopen the app.</p>
    </main>
  </body>
</html>
