<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172554" />
    <title>Kitchen Insights</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eff6ff; color: #0f172a; }
      main { width: min(420px, 100%); padding: 26px; border: 1px solid #dbeafe; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px rgba(23,37,84,.12); }
      .mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 15px; background: #2563eb; color: #fff; font-weight: 900; }
      h1 { margin: 18px 0 8px; font-size: 28px; }
      p { margin: 0; line-height: 1.5; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">KI</div>
      <h1>Kitchen Insights</h1>
      <p>The app could not reach Kitchen Insights. Check your internet connection and reopen it.</p>
    </main>
  </body>
</html>
