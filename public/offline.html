<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#214f3d" />
  <title>Kitchen Insights — Offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f3ef;
      color: #1f211d;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #e6e3dc;
      box-shadow: 0 10px 30px rgba(26, 31, 27, 0.06);
    }
    .mark {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #bd5f31;
      color: #fff;
      font-weight: 800;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0; color: #6f716a; line-height: 1.5; }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: #214f3d;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">KI</div>
    <h1>You’re offline</h1>
    <p>Kitchen Insights needs a connection for live invoices, supplier data and cloud workspace changes. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
