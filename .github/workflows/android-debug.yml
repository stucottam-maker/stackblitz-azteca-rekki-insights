name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "capacitor-shell/**"
      - "public/native-camera-bridge.js"
      - "scripts/android-widget-patch.py"
      - ".github/workflows/android-debug.yml"
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "capacitor-shell/**"
      - "public/native-camera-bridge.js"
      - "scripts/android-widget-patch.py"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor tooling
        run: npm install --no-save --ignore-scripts @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/camera@8 @capacitor/filesystem@8

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web shell and native plugins
        run: npx cap sync android

      - name: Declare Android camera permission
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          additions = []

          if "android.permission.CAMERA" not in text:
              additions.append('    <uses-permission android:name="android.permission.CAMERA" />')

          if "android.hardware.camera.any" not in text:
              additions.append('    <uses-feature android:name="android.hardware.camera.any" android:required="false" />')

          if additions:
              marker = "    <application"
              if marker not in text:
                  raise SystemExit("Could not locate <application> in AndroidManifest.xml")
              text = text.replace(marker, "\n".join(additions) + "\n\n" + marker, 1)
              manifest.write_text(text)

          print(manifest.read_text())
          PY

      - name: Apply Kitchen Insights Android branding
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          mkdir -p "$RES/values" "$RES/drawable" "$RES/mipmap-anydpi" "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi-v33"

          cat > "$RES/values/ki_colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ki_navy">#172554</color>
              <color name="ki_blue">#2563EB</color>
              <color name="ki_white">#FFFFFF</color>
          </resources>
          EOF

          cat > "$RES/drawable/ki_launcher_foreground.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M30,18 H78 C84.627,18 90,23.373 90,30 V78 C90,84.627 84.627,90 78,90 H30 C23.373,90 18,84.627 18,78 V30 C18,23.373 23.373,18 30,18 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M39,37 H45 V71 H39 Z M45,53 L58,37 H65 L51,54 L66,71 H58 L45,56 Z M69,37 H75 V71 H69 Z" />
          </vector>
          EOF

          cat > "$RES/drawable/ki_launcher_monochrome.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M30,18 H78 C84.627,18 90,23.373 90,30 V78 C90,84.627 84.627,90 78,90 H30 C23.373,90 18,84.627 18,78 V30 C18,23.373 23.373,18 30,18 Z" />
          </vector>
          EOF

          cat > "$RES/mipmap-anydpi/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/ki_navy" />
                  </shape>
              </item>
              <item
                  android:width="72dp"
                  android:height="72dp"
                  android:gravity="center"
                  android:drawable="@drawable/ki_launcher_foreground" />
          </layer-list>
          EOF
          cp "$RES/mipmap-anydpi/ic_launcher.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ki_navy" />
              <foreground android:drawable="@drawable/ki_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          cat > "$RES/mipmap-anydpi-v33/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ki_navy" />
              <foreground android:drawable="@drawable/ki_launcher_foreground" />
              <monochrome android:drawable="@drawable/ki_launcher_monochrome" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v33/ic_launcher.xml" "$RES/mipmap-anydpi-v33/ic_launcher_round.xml"

          cat > "$RES/drawable/ki_splash.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/ki_navy" />
                  </shape>
              </item>
              <item
                  android:width="144dp"
                  android:height="144dp"
                  android:gravity="center"
                  android:drawable="@drawable/ki_launcher_foreground" />
          </layer-list>
          EOF

          python - <<'PY'
          from pathlib import Path

          res = Path("android/app/src/main/res")
          for styles in res.glob("values*/styles.xml"):
              text = styles.read_text()
              text = text.replace("@drawable/splash", "@drawable/ki_splash")
              text = text.replace(
                  '<item name="android:windowSplashScreenBackground">@color/colorPrimary</item>',
                  '<item name="android:windowSplashScreenBackground">@color/ki_navy</item>',
              )
              text = text.replace(
                  '<item name="android:statusBarColor">@color/colorPrimaryDark</item>',
                  '<item name="android:statusBarColor">@color/ki_navy</item>',
              )
              styles.write_text(text)
          PY

      - name: Add Kitchen Insights Android home widgets
        run: python scripts/android-widget-patch.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kitchen-Insights-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-insights-android-debug
          path: Kitchen-Insights-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Android test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Kitchen Insights Android test build with blue launcher/splash, native invoice capture and three home-screen widgets: Quick Actions, Kitchen Today and Manager Overview. Widgets deep-link into the app and refresh their locally cached workspace metrics whenever Kitchen Insights is opened. Internal testing only; not the Google Play production build."
          if gh release view android-debug-latest >/dev/null 2>&1; then
            gh release upload android-debug-latest Kitchen-Insights-debug.apk --clobber
            gh release edit android-debug-latest \
              --title "Kitchen Insights Android Test" \
              --notes "$NOTES"
          else
            gh release create android-debug-latest Kitchen-Insights-debug.apk \
              --title "Kitchen Insights Android Test" \
              --notes "$NOTES" \
              --prerelease
          fi
