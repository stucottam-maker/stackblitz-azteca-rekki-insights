name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Optional isolated HTTPS Vercel preview URL for test APK (never production)'
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "capacitor-shell/**"
      - "public/native-camera-bridge.js"
      - "scripts/android-widget-patch.py"
      - ".github/workflows/android-debug.yml"
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "capacitor-shell/**"
      - "public/native-camera-bridge.js"
      - "scripts/android-widget-patch.py"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor tooling
        run: npm install --no-save --ignore-scripts @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/camera@8 @capacitor/filesystem@8

      - name: Select isolated Kommee preview for manual test build
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        env:
          KOMMEE_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.parse import urlparse
          from pathlib import Path
          url = os.environ["KOMMEE_PREVIEW_URL"].rstrip("/")
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.port or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.path not in ("", "/") or not parsed.hostname or not parsed.hostname.endswith(".vercel.app"):
              raise SystemExit("Only isolated HTTPS *.vercel.app deployment origins are allowed")
          config_path = Path("capacitor.config.json")
          config = json.loads(config_path.read_text())
          config["server"]["url"] = url
          config_path.write_text(json.dumps(config, indent=2) + chr(10))
          print("Using isolated Vercel preview origin for Android test build")
          PY

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web shell and native plugins
        run: npx cap sync android

      - name: Enforce Kommee native application identity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main/res")
          for path in root.glob("values*/strings.xml"):
              contents = path.read_text()
              contents, count = re.subn(r'(<string name="app_name">).*?(</string>)', r'\g<1>Kommee\g<2>', contents)
              if count == 0:
                  contents = contents.replace("</resources>", '    <string name="app_name">Kommee</string>\n</resources>')
              path.write_text(contents)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          contents = manifest.read_text()
          contents = re.sub(r'android:label="[^"]*"', 'android:label="Kommee"', contents, count=1)
          manifest.write_text(contents)
          print("Kommee Android display name enforced")
          PY

      - name: Declare Android camera permission
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          additions = []

          if "android.permission.CAMERA" not in text:
              additions.append('    <uses-permission android:name="android.permission.CAMERA" />')

          if "android.hardware.camera.any" not in text:
              additions.append('    <uses-feature android:name="android.hardware.camera.any" android:required="false" />')

          if additions:
              marker = "    <application"
              if marker not in text:
                  raise SystemExit("Could not locate <application> in AndroidManifest.xml")
              text = text.replace(marker, "\n".join(additions) + "\n\n" + marker, 1)
              manifest.write_text(text)

          print(manifest.read_text())
          PY

      - name: Apply Kommee Android branding
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          mkdir -p "$RES/values" "$RES/drawable" "$RES/mipmap-anydpi" "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi-v33"

          cat > "$RES/values/kommee_colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="kommee_forest">#214534</color>
              <color name="kommee_peach">#F08C72</color>
              <color name="kommee_cream">#F7F5ED</color>
              <color name="kommee_sage">#A9C9B4</color>
          </resources>
          EOF

          cat > "$RES/drawable/kommee_launcher_foreground.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#A9C9B4"
                  android:strokeWidth="12"
                  android:strokeLineCap="round"
                  android:pathData="M37,29 L37,79" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#F7F5ED"
                  android:strokeWidth="11.5"
                  android:strokeLineCap="round"
                  android:pathData="M74,31 L49,54" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#F08C72"
                  android:strokeWidth="11.5"
                  android:strokeLineCap="round"
                  android:pathData="M50,55 L76,78" />
          </vector>
          EOF

          cat > "$RES/mipmap-anydpi/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/kommee_forest" />
                  </shape>
              </item>
              <item android:drawable="@drawable/kommee_launcher_foreground" />
          </layer-list>
          EOF
          cp "$RES/mipmap-anydpi/ic_launcher.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/kommee_forest" />
              <foreground android:drawable="@drawable/kommee_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          cat > "$RES/mipmap-anydpi-v33/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/kommee_forest" />
              <foreground android:drawable="@drawable/kommee_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v33/ic_launcher.xml" "$RES/mipmap-anydpi-v33/ic_launcher_round.xml"

          cat > "$RES/drawable/kommee_splash.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/kommee_forest" />
                  </shape>
              </item>
              <item
                  android:width="144dp"
                  android:height="144dp"
                  android:gravity="center"
                  android:drawable="@drawable/kommee_launcher_foreground" />
          </layer-list>
          EOF

          python - <<'PY'
          from pathlib import Path

          res = Path("android/app/src/main/res")
          for styles in res.glob("values*/styles.xml"):
              text = styles.read_text()
              text = text.replace("@drawable/splash", "@drawable/kommee_splash")
              text = text.replace(
                  '<item name="android:windowSplashScreenBackground">@color/colorPrimary</item>',
                  '<item name="android:windowSplashScreenBackground">@color/kommee_forest</item>',
              )
              text = text.replace(
                  '<item name="android:statusBarColor">@color/colorPrimaryDark</item>',
                  '<item name="android:statusBarColor">@color/kommee_forest</item>',
              )
              styles.write_text(text)
          PY

      - name: Add Kommee Android home widgets
        run: python scripts/android-widget-patch.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kommee-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kommee-android-debug
          path: Kommee-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Android test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Kommee Android test build with forest-green launcher/splash, native invoice capture and three home-screen widgets: Quick Actions, Kitchen Today and Manager Overview. Widgets deep-link into the app and refresh their locally cached workspace metrics whenever Kommee is opened. Internal testing only; not the Google Play production build."
          if gh release view android-debug-latest >/dev/null 2>&1; then
            gh release upload android-debug-latest Kommee-debug.apk --clobber
            gh release edit android-debug-latest \
              --title "Kommee Android Test" \
              --notes "$NOTES"
          else
            gh release create android-debug-latest Kommee-debug.apk \
              --title "Kommee Android Test" \
              --notes "$NOTES" \
              --prerelease
          fi
