name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "capacitor-shell/**"
      - "public/native-camera-bridge.js"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor tooling
        run: npm install --no-save --ignore-scripts @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/camera@8 @capacitor/filesystem@8

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web shell and native plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kitchen-Insights-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-insights-android-debug
          path: Kitchen-Insights-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-debug-latest >/dev/null 2>&1; then
            gh release upload android-debug-latest Kitchen-Insights-debug.apk --clobber
            gh release edit android-debug-latest \
              --title "Kitchen Insights Android Test" \
              --notes "Android test build of Kitchen Insights with native camera support for invoice capture. Internal testing only; not the Google Play production build."
          else
            gh release create android-debug-latest Kitchen-Insights-debug.apk \
              --title "Kitchen Insights Android Test" \
              --notes "Android test build of Kitchen Insights with native camera support for invoice capture. Internal testing only; not the Google Play production build." \
              --prerelease
          fi
