name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "capacitor.config.json"
      - "capacitor-shell/**"
      - "app/icon.png"
      - "app/apple-icon.png"
      - "public/pwa-icon.svg"
      - "public/native-camera-bridge.js"
      - "scripts/apply-android-branding.sh"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor tooling
        run: npm install --no-save --ignore-scripts @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/camera@8 @capacitor/filesystem@8

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web shell and native plugins
        run: npx cap sync android

      - name: Apply Kitchen Insights Android branding
        run: bash scripts/apply-android-branding.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK identity and compiled branding
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -s "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='uk.kitcheninsights.app'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Kitchen Insights'"
          "$AAPT" dump resources "$APK" > /tmp/kitchen-insights-apk-resources.txt
          grep -F "ki_launcher_foreground" /tmp/kitchen-insights-apk-resources.txt
          grep -F "ki_launcher_monochrome" /tmp/kitchen-insights-apk-resources.txt
          grep -F "ki_splash" /tmp/kitchen-insights-apk-resources.txt
          if grep -i "azteca" /tmp/kitchen-insights-apk-resources.txt; then
            echo "Restaurant-specific branding leaked into compiled Android resources" >&2
            exit 1
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kitchen-Insights-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-insights-android-debug
          path: Kitchen-Insights-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-debug-latest >/dev/null 2>&1; then
            gh release upload android-debug-latest Kitchen-Insights-debug.apk --clobber
            gh release edit android-debug-latest \
              --title "Kitchen Insights Android Test" \
              --notes "Neutral Kitchen Insights Android test build with branded launcher icon, splash screen and native camera support. Internal testing only; not the Google Play production build."
          else
            gh release create android-debug-latest Kitchen-Insights-debug.apk \
              --title "Kitchen Insights Android Test" \
              --notes "Neutral Kitchen Insights Android test build with branded launcher icon, splash screen and native camera support. Internal testing only; not the Google Play production build." \
              --prerelease
          fi
